services:
  db:
    image: postgres:16-alpine
    container_name: ivr-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ivr_delivery
    ports:
      - "5432:5432"
    volumes:
      - ivr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ivr_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ivr-postgres-data:
